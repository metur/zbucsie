<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Strona</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 10px 0;
        }
        main {
            padding: 20px;
        }
        footer {
            background-color: #333;
            color: white;
            padding: 10px 0;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Witaj na mojej stronie!</h1>
    </header>
    <main>
        <p>To jest przykładowa strona stworzona dla zabawy.</p>
        <button onclick="alert('Cześć! Miłego dnia!')">Kliknij mnie</button>
    </main>
    <footer>
        <p>&copy; 2023 Moja Strona</p>
    </footer>
</body>
</html>
