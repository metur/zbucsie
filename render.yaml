services:
  - type: web
    name: zbucsie
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: zbucsie-db
          property: connectionString

databases:
  - name: zbucsie-db
    databaseName: zbucsie
    plan: free
