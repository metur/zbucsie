{% extends 'base.html' %}
{% block title %}Dashboard{% endblock %}

{% block extra_styles %}
    <style>
        .dashboard-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }
        
        .header {
            text-align: center;
            width: 100%;
        }
        
        .header h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #333;
        }
        
        .info-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            font-size: 18px;
            color: #555;
            width: 100%;
        }
        
        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .info-item span {
            font-weight: bold;
            color: #0066cc;
            font-size: 24px;
        }
        
        .image-placeholder {
            width: 400px;
            height: 400px;
            background-color: #ddd;
            border: 2px solid #999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #666;
            border-radius: 8px;
        }
        
        .buttons-container {
            display: flex;
            gap: 20px;
            width: 100%;
            justify-content: center;
        }
        
        button {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        #incrementBtn {
            background-color: #0066cc;
            color: white;
        }
        
        #incrementBtn:hover {
            background-color: #0052a3;
            transform: scale(1.05);
        }
        
        #buyWorkerBtn {
            background-color: #28a745;
            color: white;
        }
        
        #buyWorkerBtn:hover {
            background-color: #218838;
            transform: scale(1.05);
        }
    </style>
{% endblock %}

{% block content %}
    <div class="dashboard-container">
        <div class="header">
            <h1>ZBUC SIE!</h1>
        </div>
        
        <div class="info-bar">
            <div class="info-item">
                <span>{{ username }}</span>
                <div>Zalogowany jako</div>
            </div>
            <div class="info-item">
                <span id="score">{{ user_score }}</span>
                <div>Score</div>
            </div>
            <div class="info-item">
                <span id="workers">{{ workers }}</span>
                <div>Pracownicy</div>
            </div>
        </div>
        
        <div class="image-placeholder">
            [Obrazek]
        </div>
        
        <div class="buttons-container">
            <button id="incrementBtn">+<span id="incrementAmount">1</span></button>
            <button id="buyWorkerBtn">Kup pracownika ({{ worker_cost }} score)</button>
        </div>
    </div>

    <script>
        let score = {{ user_score if user_score is not none else 0 }};
        let workers = {{ workers if workers is not none else 0 }};
        const workerCost = {{ worker_cost }};
        
        function updateIncrementButton() {
            document.getElementById('incrementAmount').textContent = 1 + workers;
        }
        
        updateIncrementButton();
        
        // Increment score every second (1 base + workers)
        setInterval(function() {
            score += 1 + workers;
            document.getElementById('score').textContent = score;
            
            // Sync with server
            fetch('{{ url_for("increment_score") }}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-CSRFToken': document.querySelector('meta[name="csrf-token"]')?.content || ''
                }
            }).catch(err => console.error('Error syncing score:', err));
        }, 1000);

        // Handle manual button click
        document.getElementById('incrementBtn').addEventListener('click', function() {
            score += 1 + workers;
            document.getElementById('score').textContent = score;
            
            fetch('{{ url_for("increment_score") }}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-CSRFToken': document.querySelector('meta[name="csrf-token"]')?.content || ''
                }
            }).catch(err => console.error('Error syncing score:', err));
        });

        // Handle worker purchase
        document.getElementById('buyWorkerBtn').addEventListener('click', function() {
            if (score < workerCost) {
                alert('Nie masz wystarczającej ilości score!');
                return;
            }
            
            fetch('{{ url_for("buy_worker") }}', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': document.querySelector('meta[name="csrf-token"]')?.content || ''
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert('Błąd: ' + data.error);
                } else {
                    score = data.score;
                    workers = data.workers;
                    document.getElementById('score').textContent = score;
                    document.getElementById('workers').textContent = workers;
                    updateIncrementButton();
                }
            })
            .catch(err => console.error('Error buying worker:', err));
        });
    </script>
{% endblock %}
