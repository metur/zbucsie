{% extends 'base.html' %}
{% block title %}Rejestracja{% endblock %}
{% block content %}
    <h1>ZAREJESTRUJ SIE!</h1>
<form method="POST" action="{{ url_for('register') }}">
    {{ form.hidden_tag() }}
    <p>{{ form.username(size=32, placeholder='Nazwa użytkownika') }}</p>
    <p>{{ form.password(size=128, placeholder='Hasło') }}</p>
    <p>{{ form.submit() }}</p>
</form>
{% endblock %}
